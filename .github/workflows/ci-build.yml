name: Build and Test

on:
  - pull_request
  - push

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: CFLAGS='--coverage -g -O0' cmake -DCMAKE_BUILD_TYPE=Debug -G 'Unix Makefiles' .
      - name: Build
        run: make VERBOSE=1
      - name: Test
        run: ./test-json
      - name: Create coverage report
        run: |
          sudo apt-get install -y lcov
          lcov --directory . --capture --branch-coverage --output-file coverage.info
          lcov --list coverage.info --branch-coverage
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  windows-32:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Debug -G "NMake Makefiles" .
      - name: Build
        run: nmake
      - name: Test
        run: .\test-json.exe

  windows-64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -G "NMake Makefiles" .
      - name: Build
        run: nmake
      - name: Test
        run: .\test-json.exe
